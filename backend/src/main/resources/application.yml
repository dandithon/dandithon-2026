spring:
  application:
    name: dandithon-backend
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  profiles:
    default: local
  jackson:
    deserialization:
      accept-float-as-int: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/v1/**

# Separate fictional queue; new paid guest orders are always instantly ready.
eta:
  enabled: ${SEOMUN_ETA_ENABLED:true}
  seconds-per-minute: ${SEOMUN_ETA_SECONDS_PER_MINUTE:60}
