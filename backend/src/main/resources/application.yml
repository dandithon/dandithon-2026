spring:
  application:
    name: dandithon-backend
  profiles:
    default: local
  jackson:
    deserialization:
      accept-float-as-int: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/v1/**

# Opt in after the frontend is ready; previews remain available when disabled.
eta:
  enabled: ${SEOMUN_ETA_ENABLED:false}
  seconds-per-minute: ${SEOMUN_ETA_SECONDS_PER_MINUTE:5}
